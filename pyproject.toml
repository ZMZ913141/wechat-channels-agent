[project]
name = "wchannels"
version = "3.1.0"
description = "多平台（视频号/抖音/小红书）多用户视频发布工作台（本地部署）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.48.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wchannels = "wchannels.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wchannels"]

[tool.uv]
package = true
