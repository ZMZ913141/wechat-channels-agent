{% extends "base.html" %}
{% block title %}登录日志{% endblock %}
{% block content %}
<div class="card">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <h2 style="margin:0">📄 登录日志 · {{ name }} <span class="muted" style="font-size:12px">({{ aid }})</span></h2>
    <a class="btn ghost" style="margin-left:auto" href="/accounts">← 返回账号管理</a>
  </div>
  <p class="muted" style="margin:8px 0 0;font-size:11.5px">
    点「扫码登录」时如果<b>没有窗口弹出</b>或窗口一闪而过，就看这里——脚本的全部输出都在。
  </p>
</div>
<div class="card">
  <pre class="logview">{{ content }}</pre>
</div>
{% endblock %}
