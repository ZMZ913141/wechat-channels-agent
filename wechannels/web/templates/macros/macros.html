{# 素材卡片 —— 首页网格里的单张卡片
   注意：thumb() 产出的 <video preload="metadata"> 每次都是一次 HTTP 请求。
   素材上千时不能全量加载，所以用 data-src 懒加载（IntersectionObserver），
   只有滚动进视口的卡片才真正请求。 #}
{% macro material_card(m, label_filter='') %}
<div class="mcard {{ status_class(m.status) }}">
  <input type="checkbox" class="check-mat" name="mids" value="{{ m.id }}"
         onchange="selChanged(this)">
  <div class="thumb" data-thumb data-mid="{{ m.id }}">{{ thumb_lazy(m)|safe }}</div>
  <div class="mbody">
    <div class="mtitle" title="{{ m.title }}">{{ m.title or '(无标题)' }}</div>

    {% if m.collection %}
    <div class="mcoll"><a href="/?collection={{ m.collection|urlencode }}" title="按合集筛选">📚 {{ m.collection }}</a></div>
    {% endif %}

    {# 分类标签：内部管理用，可点筛选 #}
    <div class="mlabels">
      {% for lb in m.labels_list %}
      <a class="lchip{{ ' on' if label_filter and lb|lower == label_filter|lower else '' }}"
         href="/?label={{ lb|urlencode }}" title="按「{{ lb }}」筛选">{{ lb }}</a>
      {% endfor %}
    </div>

    {# 话题标签：发布时进视频描述，观众可见 #}
    <div class="mtags">
      {% for t in m.topic_list %}<span class="tag">#{{ t }}</span>{% endfor %}
    </div>

    <div class="mbadge"><span class="st {{ m.status }}">{{ m.status }}</span>{{ badges(m)|safe }}</div>

    {% if m.publish_history %}
    <div class="hist">
      {% for h in m.publish_history[-3:]|reverse %}
      <div class="hist">{{ '✅' if h.ok else '❌' }} {{ h.time }} → {{ h.account_name }}
        <span class="{{ 'ok' if h.ok else 'bad' }}">{{ h.result[:80] }}</span></div>
      {% endfor %}
    </div>
    {% endif %}

    <div class="mactions">
      <button class="mini" onclick="copyText(this)" data-copy="{{ copy_text(m) }}">复制文案</button>
      <a class="mini" href="/materials/{{ m.id }}/edit">编辑</a>
      <a class="mini" href="/publish?material={{ m.id }}">发布</a>
      <a class="mini" href="/materials/{{ m.id }}/clone">复用</a>
      <a class="mini" href="/materials/{{ m.id }}/status?status=已发布">标已发</a>
      {# 删除是破坏性操作 → 用 POST 提交，不用 GET 链接：
         避免浏览器预取 / 爬虫 / 链接预览误触发删除 #}
      <form method="post" action="/materials/{{ m.id }}/delete" style="display:inline"
            onsubmit="return confirm('删除此素材「{{ m.title }}」？\n\n只删素材记录，你的视频文件不会被删除。')">
        <button class="mini danger" type="submit" title="删除素材记录（不动视频文件）">删除</button>
      </form>
    </div>
    <div class="mpath muted" title="{{ m.video_path or m.cover_path }}">
      {{ m.video_path or m.cover_path or '（未设置文件）' }}
    </div>
  </div>
</div>
{% endmacro %}
