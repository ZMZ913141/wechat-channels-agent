{# 批量拖入区：放在素材库页顶部，一次拖多个视频自动建素材。
   与下面「新建素材」的单条表单分开——批量场景不该被迫逐条填文案。 #}
<form method="post" action="/materials/batch_upload" enctype="multipart/form-data"
      id="bulkForm" class="card" style="border-style:dashed;border-width:2px">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div>
      <div style="font-size:15px;font-weight:600">📥 批量拖入视频</div>
      <div class="muted" style="font-size:11.5px;margin-top:2px">
        把多个视频一次性拖进来，自动建素材（标题取文件名）。入库后再逐条补文案、标签、封面。
      </div>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input name="labels" list="dl_labels_bulk" placeholder="统一打标签（可选，如：待发布）"
             style="padding:6px 9px;font-size:12px;width:170px">
      <datalist id="dl_labels_bulk">
        {% for n in all_label_names %}<option value="{{ n }}">{% endfor %}
      </datalist>
      <button class="btn" type="button" onclick="pickBulk()">选择文件…</button>
    </div>
  </div>

  <input type="file" name="video_files" id="bulkFiles" multiple
         accept="video/*,.mp4,.mov,.m4v,.webm,.avi,.mkv,.flv,.ts" style="display:none">

  <div id="bulkZone" class="bulkzone"
       onclick="pickBulk()"
       ondragover="bulkDrag(event,true)" ondragleave="bulkDrag(event,false)"
       ondrop="bulkDrop(event)">
    <div id="bulkHint">把视频文件拖到这里，或点击选择（可多选）</div>
  </div>

  <div id="bulkList" class="bulks"></div>

  <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
    <button class="btn" type="submit" id="bulkGo" disabled>入库 0 个</button>
    <span class="muted" id="bulkMsg" style="font-size:12px"></span>
    <span class="muted" style="margin-left:auto;font-size:11.5px">
      已入库的同名文件会自动改名，不会覆盖已有素材
    </span>
  </div>
</form>

<script>
(function () {
  'use strict';
  var MAX = 100;   // 防止一次拖进来几百个把服务器压垮

  function pickBulk() { document.getElementById('bulkFiles').click(); }

  function bulkDrag(e, on) {
    e.preventDefault(); e.stopPropagation();
    document.getElementById('bulkZone').classList.toggle('over', on);
  }

  function bulkDrop(e) {
    e.preventDefault(); e.stopPropagation();
    document.getElementById('bulkZone').classList.remove('over');
    var dt = e.dataTransfer;
    if (!dt) return;
    if (dt.files && dt.files.length) { setFiles(dt.files); return; }
    // 拖的是文件夹/路径文本（从资源管理器拖文件夹时）
    var txt = dt.getData('text/plain');
    if (txt) {
      document.getElementById('bulkMsg').textContent =
        '检测到拖入的是路径文本，请用「选择文件…」或「目录导入」处理';
    }
  }

  function setFiles(list) {
    var arr = Array.prototype.slice.call(list, 0, MAX);
    var input = document.getElementById('bulkFiles');
    // DataTransfer 让 input.files 真正可提交（直接赋值无效）
    try {
      var dt = new DataTransfer();
      arr.forEach(function (f) { dt.items.add(f); });
      input.files = dt.files;
    } catch (e) {
      // 老浏览器降级：用 FormData 额外字段
    }
    var over = list.length > MAX ? '（已截取前 ' + MAX + ' 个）' : '';
    document.getElementById('bulkMsg').textContent =
      over + '已选择 ' + arr.length + ' 个文件';
    var html = arr.map(function (f) {
      var mb = (f.size / 1048576).toFixed(1);
      return '<span class="bulkchip">' + escapeHtml(f.name) +
             '<i>' + mb + 'MB</i></span>';
    }).join('');
    document.getElementById('bulkList').innerHTML = html;
    var btn = document.getElementById('bulkGo');
    btn.disabled = arr.length === 0;
    btn.textContent = '入库 ' + arr.length + ' 个';
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  window.pickBulk = pickBulk;
  window.bulkDrag = bulkDrag;
  window.bulkDrop = bulkDrop;

  document.addEventListener('DOMContentLoaded', function () {
    var inp = document.getElementById('bulkFiles');
    if (inp) inp.addEventListener('change', function () { setFiles(inp.files); });
  });
})();
</script>
