{# 文件已丢失、无法发布的素材 #}
{% if orphans %}
<form method="post" action="/library/orphans" class="grp">
  {% for o in orphans %}
  <div class="row">
    <span class="st bad">{{ o.reason }}</span>
    <div class="grow ellip" title="{{ o.video_path }}">{{ o.title or '(无标题)' }}</div>
    <span class="muted">{{ o.updated_at[:16] }}</span>
  </div>
  <input type="hidden" name="mids" value="{{ o.id }}">
  {% endfor %}
  <button class="btn danger" style="margin-top:8px;padding:5px 12px;font-size:12px" type="submit">
    清理这 {{ orphans|length }} 条记录（只删记录，视频文件不动）
  </button>
</form>
{% else %}
<div class="empty">没有丢失文件的素材 ✓</div>
{% endif %}
