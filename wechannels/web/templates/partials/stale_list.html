{# 归档候选：已发布且超过 N 天 #}
{% if stales %}
<div class="grp">
  {% for s in stales %}
  <div class="row">
    <span class="st">已发布</span>
    <div class="grow ellip">{{ s.title or '(无标题)' }}</div>
    <span class="muted">更新于 {{ s.updated_at[:10] }}</span>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="empty">没有需要归档的旧素材 ✓</div>
{% endif %}
